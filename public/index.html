<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yugs: Playground Dueling</title>
  <meta name="description" content="A free Yu-Gi-Oh! ranked ladder in your browser: open packs, build decks and duel players of your level.">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#07080a">
  <meta property="og:title" content="Yugs: Playground Dueling">
  <meta property="og:description" content="A free Yu-Gi-Oh! ranked ladder in your browser: open packs, build decks and duel players of your level.">
  <meta property="og:url" content="https://playgrounddueling.com/">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://playgrounddueling.com/branding/og.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Yugs <span class="tag beta-tag">beta</span></div>
    <div class="turninfo" id="turninfo"></div>
    <div class="top-actions">
      <button id="btn-report" class="ghost">Report a bug</button>
      <button id="btn-surrender" class="ghost">Surrender</button>
      <button id="btn-new">New duel</button>
    </div>
  </header>

  <main class="layout">
    <aside class="detail" id="detail">
      <div class="detail-empty">Hover over a card to read it.</div>
    </aside>

    <section class="table">
      <div class="side side-top" id="side-1"></div>
      <div class="emz-row" id="emz-row"></div>
      <div class="side side-bottom" id="side-0"></div>
    </section>

    <aside class="rightcol">
      <div class="prompt" id="prompt"></div>
      <div class="actions" id="actions"></div>
      <div class="log" id="log"></div>
    </aside>
  </main>

  <div class="modal-backdrop hidden" id="modal">
    <div class="modal">
      <div class="modal-title" id="modal-title"></div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>

  <div class="popup hidden" id="popup"></div>

  <!-- Cards shown by an effect (excavated, revealed, looked at). Doesn't block the game. -->
  <div class="reveal hidden" id="reveal"></div>

  <div class="lobby hidden" id="lobby">
    <div class="lobby-box" id="lobby-box"></div>
  </div>

  <div class="winner hidden" id="winner">
    <div class="winner-box">
      <div class="winner-text" id="winner-text"></div>
      <div class="winner-reason" id="winner-reason"></div>
      <div class="winner-actions">
        <button id="btn-again">Back to menu</button>
      </div>
    </div>
  </div>

  <footer class="footer">Not affiliated with or endorsed by Konami or Shueisha. Duel engine and card scripts by Project Ignis (AGPL-3.0). Yugs is free software too: <a href="https://github.com/Vamoelbolso24/Yugs" target="_blank" rel="noopener">source code</a> (AGPL-3.0). Contact: <a href="mailto:support@playgrounddueling.com">support@playgrounddueling.com</a> · <a href="https://discord.gg/yZAxvH4Sw" target="_blank" rel="noopener">Discord</a></footer>
  <script src="/images.js"></script>
  <script src="/cardFilter.js"></script>
  <script src="/menus.js"></script>
  <script src="/packMaker.js"></script>
  <script src="/banlistEditor.js"></script>
  <script src="/reports.js"></script>
  <script src="/players.js"></script>
  <script src="/rules.js"></script>
  <script src="/app.js"></script>
</body>
</html>
